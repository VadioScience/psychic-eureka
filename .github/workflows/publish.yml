name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Generate sources
        run: ./gradlew genSources
      
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Publish to CurseForge (Optional)
        # Раскомментируйте когда будет API ключ
        # uses: itsmeow/curseforge-upload@v3
        # with:
        #   file_path: build/libs/blockliftgun-*.jar
        #   game_endpoint: minecraft
        #   game_versions: 1.21.1
        #   release_type: release
        #   changelog: "See https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION }}"
        #   display_name: "BlockLiftGun ${{ steps.version.outputs.VERSION }}"
        run: echo "CurseForge publish - add your token to enable"
      
      - name: Publish to Modrinth (Optional)
        # Раскомментируйте когда будет API ключ
        # uses: Kir-Antipov/mc-publish@v3.2
        # with:
        #   curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        #   modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        #   
        #   files: build/libs/blockliftgun-*.jar
        #   
        #   name: BlockLiftGun ${{ steps.version.outputs.VERSION }}
        #   version: ${{ steps.version.outputs.VERSION }}
        #   version-type: release
        #   
        #   changelog-file: CHANGELOG.md
        #   
        #   loaders: neoforge
        #   game-versions: 1.21.1
        run: echo "Modrinth publish - add your token to enable"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
